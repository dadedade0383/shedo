name: 每日考公素材抓取

on:
  schedule:
    # 每天北京时间 7:00 (UTC 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许 push

jobs:
  fetch-daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行抓取脚本
        run: python scripts/fetch_daily_brief.py

      - name: 提交并推送
        run: |
          git config user.name "shedo-bot"
          git config user.email "bot@shedo.workbench"
          git add data/daily-brief-*.json data/index.json
          if git diff --staged --quiet; then
            echo "没有新内容，跳过推送"
          else
            git commit -m "📰 自动抓取 $(date +%Y-%m-%d) 申论素材"
            git push
            echo "✅ 推送成功"
          fi
